seed: 0

base_model_config:
  model: GraphSAGE
  hidden_layer_size: 32
  heads: 2
  layers: 2
  aggr: gcn
  lr: 0.001
  dropout: 0.2

logging_config:
  use_wandb: False
  wandb_config:
    log_model: False
    group: "base"
    job_type: "debug"

epochs: 10
batch_size: 128
num_workers: 15
dataset:
  name: "Pokec"
resource_config:
  cpus: 24
  nodes: 1
  gpus: 1
dataset_split_fractions:
  train: 0.3
  valid: 0.2
  calib: 0.25
output_dir: "./outputs"
dataset_dir: "./datasets"
job_id: "base_pokec_graphsage"
resume_from_checkpoint: False
num_server_rounds: 10
num_clients: 2
fraction_fit: 0.5
