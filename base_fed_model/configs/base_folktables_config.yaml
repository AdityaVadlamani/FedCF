seed: 0

base_model_config:
  booster: gbtree
  tree_method: hist     
  colsample_bylevel: 0.9
  colsample_bynode: 0.9
  colsample_bytree: 0.9
  subsample: 0.9
  gamma: 0.2
  lr: 0.05
  max_depth: 6
  max_leaves: 256
  n_estimators: 10
  reg_alpha: 1.0
  reg_lambda: 1.0

logging_config:
  use_wandb: False
  wandb_config:
    log_model: False
    group: "base"
    job_type: "debug"

epochs: 25
batch_size: 2048
num_workers: 1
dataset:
  name: ACSEducation
  force_reprep: False

resource_config:
  cpus: 20
  nodes: 1
  gpus: 1
dataset_split_fractions:
  train: 0.3
  valid: 0.2
  calib: 0.25
output_dir: "./outputs"
dataset_dir: "./datasets"
job_id: "base_ACSEducation_xgb"
resume_from_checkpoint: False
num_server_rounds: 50
fraction_fit: 0.5