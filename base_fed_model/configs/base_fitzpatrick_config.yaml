seed: 0

base_model_config:
  architecture: "resnet18"
  lr: 0.0001

logging_config:
  use_wandb: False
  wandb_config:
    log_model: False
    group: "base"
    job_type: "debug"

epochs: 10 # --> 5
batch_size: 128 # --> 4
num_workers: 15
dataset:
  name: "Fitzpatrick"
resource_config:
  cpus: 24
  nodes: 1
  gpus: 1
dataset_split_fractions:
  train: 0.3
  valid: 0.1
  calib: 0.1
output_dir: "./outputs"
dataset_dir: "./datasets"
job_id: "base_fitzpatrick_resnet"
resume_from_checkpoint: False
num_server_rounds: 50
num_clients: 10
fraction_fit: 0.5
