debug_mode: True
fairness_metric: Equal_Opportunity
cf_opt:
  num_opt_rounds: 100
  lr: 0.1
  momentum: 0.9
client_formulations: 0
seed: 0
dataset:
  name: "Pokec"
dataset_split_fractions:
  train: 0.3
  valid: 0.1
  calib: 0.1
output_dir: "./outputs"
dataset_dir: "./datasets"
num_workers: 1
job_id: "fair_fed_pokec"

num_clients: 1
quantile_method: "mean"

logging_config:
  use_wandb: False
  wandb_config:
    log_model: False
    group: "cf_fed"
    job_type: "debug"

primitive_config:
  use_tps_classwise: False
  use_aps_epsilon: True

diffusion_config:
  use_tps_classwise: False
  use_aps_epsilon: True

base_job_id: "best_Pokec_split_0.3_0.2"
alpha: 0.1
conformal_method: "aps"
conformal_metrics:
  [
    "set_sizes",
    "coverage",
    "efficiency",
    "size_stratified_coverage",
    "label_stratified_coverage",
    "singleton_hit_ratio",
  ]
